<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文字母</title>
<script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+TC:wght@400;700&display=swap');
:root{
  --ini:#E84040;--ini-bg:#FFF0F0;--ini-br:#FFBABA;
  --med:#0FA870;--med-bg:#EAFAF4;--med-br:#80DDB8;
  --fin:#2E86DE;--fin-bg:#EAF3FF;--fin-br:#A9D0F5;
  --vow:#B25CE0;--vow-bg:#F6ECFF;--vow-br:#DCB8FA;
  --page:#FFF9F0;--dark:#2D2D2D;--mid:#636E72;
  --fnt:'Nunito','Noto Sans TC',sans-serif;
  --fzh:'Noto Sans TC',sans-serif;
  --dbox: clamp(140px, min(60vw,34vh), 380px);
}
*{box-sizing:border-box;margin:0;padding:0}
html, body{ height:100%; overflow:hidden; }
body{
  font-family:var(--fnt);
  background:linear-gradient(160deg,#fff6e5,#e8f7ff 60%,#f0ffe8);
  display:flex;
  flex-direction:column;
  padding:clamp(36px,7vmin,90px);
  -webkit-tap-highlight-color: transparent;
}
.title{
  text-align:center;
  font-weight:900;
  font-size:clamp(20px,4vw,30px);
  color:var(--dark);
  letter-spacing:1px;
  margin-bottom:6px;
}
.subtitle{
  text-align:center;
  font-family:var(--fzh);
  color:var(--mid);
  font-size:clamp(12px,2.4vw,15px);
  margin-bottom:14px;
}
.chart-wrap{ width:100%; }
.chart-wrap{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}
.chart{
  display:grid;
  justify-content:center;
  align-content:center;
}
.bc{
  border-radius:16px;
  border:2px solid transparent;
  font-family:var(--fnt);
  font-weight:800;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,0.12), 0 6px 10px rgba(0,0,0,0.06);
  transition:transform .12s ease, box-shadow .12s ease;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
  overflow:hidden;
  padding:4% 2%;
}
.bc-anim{
  width:58%;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
.bc-anim img{
  width:100%; height:100%; object-fit:contain;
}
.bc-letter{
  font-family:var(--fnt);
  font-weight:800;
  line-height:1;
  flex:0 0 auto;
}
.bc.i{background:var(--ini-bg);color:var(--ini);border-color:var(--ini-br)}
.bc.m{background:var(--med-bg);color:var(--med);border-color:var(--med-br)}
.bc.f{background:var(--fin-bg);color:var(--fin);border-color:var(--fin-br)}
.bc.v{background:var(--vow-bg);color:var(--vow);border-color:var(--vow-br)}
.bc:hover{
  transform:translateY(-3px) scale(1.08);
  filter:brightness(1.08) saturate(1.3);
  box-shadow:0 6px 0 rgba(0,0,0,0.15), 0 10px 16px rgba(0,0,0,0.15);
}
.bc:active{ transform:translateY(2px) scale(.96); box-shadow:0 1px 0 rgba(0,0,0,0.12); }

/* modal */
.overlay{
  position:fixed; inset:0;
  background:rgba(40,30,20,0.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:16px;
}
.overlay.show{ display:flex; }
.modal{
  background:rgba(255,253,247,0.72);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border-radius:28px;
  padding:clamp(52px,9vmin,76px) clamp(18px,4vmin,48px) clamp(28px,5vmin,48px);
  max-width:min(94vw,1200px);
  max-height:92vh;
  max-height:92dvh;
  overflow:hidden;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
  position:relative;
  animation:pop .25s ease;
}
@keyframes pop{ from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
.close-btn{
  position:absolute; top:12px; right:14px;
  background:#ffdede; border:none; color:#a33;
  width:clamp(32px,5vmin,44px); height:clamp(32px,5vmin,44px);
  border-radius:50%; font-size:clamp(16px,2.6vmin,22px); font-weight:800; cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease;
}
.close-btn:hover{
  background:#ffc2c2;
  transform:scale(1.1);
  box-shadow:0 4px 10px rgba(0,0,0,0.18);
}
.close-btn:active{ transform:scale(.95); box-shadow:none; }
.dcard-row{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(16px,3vmin,32px); margin:10px 0 20px;
}
@media (orientation: landscape){
  .dcard-row{ flex-direction:row; align-items:stretch; }
  :root{ --dbox: clamp(100px, min(30vw,55vh), 380px); }
}
@media (orientation: portrait){
  :root{ --dbox: clamp(95px, min(60vw, calc((92vh - 220px) / 2)), 340px); }
}
/* dvh reflects the browser's actual visible area (excludes address/nav bars),
   so it prevents the popup from being sized larger than what's really on screen */
@supports (height: 100dvh){
  .modal{ max-height:94dvh; }
  @media (orientation: landscape){
    :root{ --dbox: clamp(100px, min(30vw, calc(94dvh - 185px)), 380px); }
    .modal{ padding-top:clamp(36px,8dvh,76px); padding-bottom:clamp(14px,3.5dvh,48px); }
  }
  @media (orientation: portrait){
    :root{ --dbox: clamp(95px, min(60vw, calc((94dvh - 235px) / 2)), 340px); }
  }
  @media (orientation: landscape) and (max-height: 480px){
    .modal{ padding:clamp(30px,7dvh,48px) clamp(12px,3vw,24px) clamp(14px,3.5dvh,20px); }
    .close-btn{ width:28px; height:28px; font-size:13px; top:6px; right:8px; }
    .dcard-row{ gap:clamp(10px,2vw,20px); margin:6px 0 8px; }
    .controls{ gap:8px; margin-top:6px; }
    .ctrl-btn{ padding:clamp(5px,1.4dvh,10px) clamp(8px,2vw,16px); font-size:clamp(11px,2.4dvh,15px); }
    .ctrl-btn svg{ width:clamp(15px,3dvh,20px); height:clamp(15px,3dvh,20px); }
  }
}
.sbox{
  width:var(--dbox); height:var(--dbox);
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  border:2px solid #EEE; border-radius:14px; background:#F7F8FA;
  overflow:hidden;
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.sbox:hover{ border-color:#93C5FD; box-shadow:0 4px 14px rgba(0,0,0,.12); transform:scale(1.03); }
.sbox .letter-stage{
  width:92%; height:88%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3%;
}
.slot-upper, .slot-lower{
  flex:1 1 0; height:100%;
  min-width:0;
}
.sbox svg{ width:100%; height:100%; overflow:visible; display:block; }
.sbox svg path{
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.sbox svg path.guide{
  stroke:#DBE0E6;
  stroke-width:15;
}
.sbox svg path.draw{
  stroke:currentColor;
  stroke-width:15;
}
.sbox{ position:relative; container-type:size; container-name:sbox; }
.imgbox{
  width:var(--dbox); height:var(--dbox); flex:0 0 auto; border-radius:14px; overflow:hidden;
  border:2px solid #EEE; background:#F4F6FF; display:flex; flex-direction:column;
  container-type:size; container-name:imgbox; cursor:pointer;
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.imgbox:hover{ border-color:#93C5FD; box-shadow:0 4px 14px rgba(0,0,0,.12); transform:scale(1.03); }
.imgarea{ width:100%; flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; }
.fb-emoji{ font-size:min(58cqh,58cqw); line-height:1; display:inline-block; }
.imgarea dotlottie-player, .imgarea img{ width:min(58cqh,58cqw); height:min(58cqh,58cqw); object-fit:contain; }
.wordrow{
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:clamp(4px,4cqh,10px) 10px;
  background:#F7F8FA; border-top:1px solid #EEE;
}
.word{ font-size:clamp(.85rem,13cqh,1.9rem); font-weight:800; font-family:var(--fnt); }
.phonetic{ font-size:clamp(.6rem,8cqh,1.05rem); color:#888; font-family:var(--fnt); }

.controls{
  display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:10px;
}
.ctrl-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px;
  padding:clamp(8px,1.6vmin,14px) clamp(14px,3vmin,26px);
  font-family:var(--fnt); font-size:clamp(14px,2.2vmin,20px); font-weight:700; cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,0.15); transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  white-space:nowrap;
}
.ctrl-btn svg{ width:clamp(20px,4vw,28px); height:clamp(20px,4vw,28px); display:block; }
.ctrl-btn:not(:disabled):hover{
  transform:translateY(-2px);
  filter:brightness(1.06) saturate(1.2);
  box-shadow:0 5px 0 rgba(0,0,0,0.15), 0 8px 12px rgba(0,0,0,0.12);
}
.ctrl-btn:not(:disabled):active{
  transform:translateY(3px) scale(.96);
  box-shadow:none;
  filter:brightness(.92);
  transition:transform .05s ease, box-shadow .05s ease, filter .05s ease;
}
.replay{ background:#ffe08a; color:#7a5200; }
.prev,.next{ background:#c9f2c0; color:#245c1a; }
.prev:disabled,.next:disabled{ opacity:.35; cursor:default; }
@media (orientation: portrait){
  .controls{ flex-wrap:nowrap; width:100%; gap:clamp(4px,2vw,12px); }
  .ctrl-btn{ flex:1 1 0; min-width:0; gap:clamp(2px,1.2vw,8px); padding:clamp(6px,1.8vw,14px) clamp(4px,2.4vw,22px); font-size:clamp(11px,3.1vw,20px); }
  .ctrl-btn svg{ width:clamp(18px,5vw,24px); height:clamp(18px,5vw,24px); }
}
@keyframes popIn{ from{transform:scale(.4) rotate(-8deg); opacity:0} to{transform:scale(1) rotate(0); opacity:1} }
</style>
</head>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">

function loadButtonIcon(item, animEl) {
  const svgUrl = `https://raw.githubusercontent.com/googlefonts/noto-emoji/main/svg/emoji_u${item.ecode}.svg`;
  animEl.innerHTML = `<img src="${svgUrl}" alt="${item.word}" onerror="this.parentElement.innerHTML='<span style=\\'font-size:1.6em\\'>${item.emoji}</span>'" />`;
}

function renderStaticPopupIcon(item, containerEl) {
  const svgUrl = `https://raw.githubusercontent.com/googlefonts/noto-emoji/main/svg/emoji_u${item.ecode}.svg`;
  containerEl.innerHTML = `<img src="${svgUrl}" alt="${item.word}" onerror="this.parentElement.innerHTML='<span class=\\'fb-emoji\\'>${item.emoji}</span>'" />`;
}

function loadPopupIcon(item, containerEl, myGen) {
  // Letters known to have no animated version: show the same static image as the main grid directly.
  if (item.hasAnim === false) {
    renderStaticPopupIcon(item, containerEl);
    return;
  }

  const lottieUrl = `https://fonts.gstatic.com/s/e/notoemoji/latest/${item.ecode}/lottie.json`;
  containerEl.innerHTML = `<dotlottie-player src="${lottieUrl}" background="transparent" speed="1" loop autoplay></dotlottie-player>`;
  const player = containerEl.querySelector('dotlottie-player');
  if (!player) { renderStaticPopupIcon(item, containerEl); return; }

  player.addEventListener('error', () => {
    if (myGen !== animGen) return;
    renderStaticPopupIcon(item, containerEl);
  }, { once: true });
}

LETTERS.forEach((item, idx) => {
  const btn = document.createElement('button');
  btn.className = `bc ${item.type}`;
  btn.type = 'button';
  btn.title = `${item.L}${item.s} — ${item.word}`;
  btn.addEventListener('click', () => openLetter(idx));

  const animEl = document.createElement('div');
  animEl.className = 'bc-anim';
  animEl.innerHTML = `<span style="font-size:1.6em">${item.emoji}</span>`;

  const letterEl = document.createElement('div');
  letterEl.className = 'bc-letter';
  letterEl.textContent = item.L;

  btn.appendChild(animEl);
  btn.appendChild(letterEl);
  chartEl.appendChild(btn);

  loadButtonIcon(item, animEl);
});

function layoutChart() {
  const n = LETTERS.length;
  const availW = chartWrapEl.clientWidth;
  const availH = chartWrapEl.clientHeight;
  if (availW <= 0 || availH <= 0) return;

  const gap = Math.max(6, Math.min(16, availW * 0.012));

  let best = { cols: n, size: 0 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const sizeW = (availW - gap * (cols - 1)) / cols;
    const sizeH = (availH - gap * (rows - 1)) / rows;
    const size = Math.min(sizeW, sizeH);
    if (size > best.size) best = { cols, size };
  }

  const size = Math.max(40, Math.floor(best.size));
  chartEl.style.gridTemplateColumns = `repeat(${best.cols}, ${size}px)`;
  chartEl.style.gap = `${gap}px`;
  document.querySelectorAll('.bc').forEach(btn => {
    btn.style.width = size + 'px';
    btn.style.height = size + 'px';
    btn.style.fontSize = Math.max(11, size * 0.24) + 'px';
  });
}

window.addEventListener('resize', () => requestAnimationFrame(layoutChart));
window.addEventListener('orientationchange', () => setTimeout(layoutChart, 100));
layoutChart();

const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');
const replayBtn = document.getElementById('replayBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
let currentIndex = 0;
let currentItem = null;
let animGen = 0;

function openLetter(idx) {
  overlay.classList.add('show');
  playIndex(idx);
}
function closeModal() {
  overlay.classList.remove('show');
  animGen++;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}
closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function refitPopupIfOpen() { if (overlay.classList.contains('show')) fitPopup(); }
window.addEventListener('resize', () => requestAnimationFrame(refitPopupIfOpen));
window.addEventListener('orientationchange', () => setTimeout(refitPopupIfOpen, 150));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => requestAnimationFrame(refitPopupIfOpen));
}

replayBtn.addEventListener('click', () => playIndex(currentIndex));
prevBtn.addEventListener('click', () => { if (currentIndex > 0) playIndex(currentIndex - 1); });
nextBtn.addEventListener('click', () => { if (currentIndex < LETTERS.length - 1) playIndex(currentIndex + 1); });

function playIndex(idx) {
  currentIndex = idx;
  const item = LETTERS[idx];
  currentItem = item;
  render(item);
  speak(item);
  prevBtn.disabled = (idx === 0);
  nextBtn.disabled = (idx === LETTERS.length - 1);
}

function makeUtter(txt) {
  const voices = window.speechSynthesis.getVoices();
  const en = voices.find(v => /en.?US/i.test(v.lang)) || voices.find(v => /en/i.test(v.lang));
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'en-US'; u.rate = 0.85;
  if (en) u.voice = en;
  return u;
}
function speak(item) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u1 = makeUtter(item.L);
  const u2 = makeUtter(item.word);
  u1.onend = () => setTimeout(() => window.speechSynthesis.speak(u2), 280);
  window.speechSynthesis.speak(u1);
}
function speakLetter(item) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(makeUtter(item.L));
}
function speakWord(item) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(makeUtter(item.word));
}

function typeColor(item) {
  return item.type === 'i' ? 'var(--ini)' : item.type === 'm' ? 'var(--med)' : item.type === 'f' ? 'var(--fin)' : 'var(--vow)';
}

// separate colors for uppercase vs lowercase stroke animation
function typeColorUpper(item) { return typeColor(item); }
function typeColorLower(item) { return 'var(--fin)'; }

function splitStrokes(d) {
  return d.split(/\s(?=M)/).map(s => s.trim()).filter(Boolean);
}

function render(item) {
  const row = document.getElementById('dcardRow');
  const colorUpper = typeColorUpper(item);
  const colorLower = typeColorLower(item);
  const dU = LETTER_PATHS[item.L] || '';
  const dL = LETTER_PATHS_LOWER[item.s] || '';
  row.innerHTML = `
    <div class="sbox" title="重播筆劃動畫">
      <div class="letter-stage">
        <div class="slot-upper" style="color:${colorUpper}">
          <svg viewBox="0 0 100 140" preserveAspectRatio="xMidYMid meet">
            <path class="guide" d="${dU}"></path>
            <g id="strokesUpper"></g>
          </svg>
        </div>
        <div class="slot-lower" style="color:${colorLower}">
          <svg viewBox="0 0 100 140" preserveAspectRatio="xMidYMid meet">
            <path class="guide" d="${dL}"></path>
            <g id="strokesLower"></g>
          </svg>
        </div>
      </div>
    </div>
    <div class="imgbox" title="念出這個單字">
      <div class="imgarea" id="ea"><span class="fb-emoji">${item.emoji}</span></div>
      <div class="wordrow">
        <div class="word">${item.word}</div>
        <div class="phonetic">${item.ph}</div>
      </div>
    </div>`;

  const sbox = row.querySelector('.sbox');
  sbox.addEventListener('click', () => { animateLetter(); speakLetter(item); });
  const imgbox = row.querySelector('.imgbox');
  imgbox.addEventListener('click', () => speakWord(item));

  animateLetter();
  fitPopup();

  const eaEl = document.getElementById('ea');
  loadPopupIcon(item, eaEl, animGen);
}

// Sizes the popup's two boxes (letter-trace + image/word) so the whole modal
// always fits inside the browser's actually-visible area, on any screen size
// or orientation — no clipping, and no scrollbar ever needed.
function fitPopup() {
  const modal = document.querySelector('.modal');
  const row = document.getElementById('dcardRow');
  if (!modal || !row) return;
  const boxes = row.querySelectorAll('.sbox, .imgbox');
  if (!boxes.length) return;

  // Reset to CSS defaults first so measurements reflect natural sizing.
  boxes.forEach(b => { b.style.width = ''; b.style.height = ''; });
  modal.style.maxHeight = '';
  modal.style.maxWidth = '';

  const vv = window.visualViewport;
  const viewportH = Math.round(vv ? vv.height : window.innerHeight);
  const viewportW = Math.round(vv ? vv.width : window.innerWidth);
  const overlayPadding = 32; // matches .overlay{ padding:16px } on each side

  const maxModalH = Math.max(160, viewportH - overlayPadding);
  const maxModalW = Math.min(Math.max(200, viewportW - overlayPadding), 1200);

  // Cap the modal itself to what's actually visible on screen right now.
  modal.style.maxHeight = maxModalH + 'px';
  modal.style.maxWidth = maxModalW + 'px';

  const cs = getComputedStyle(modal);
  const padTop = parseFloat(cs.paddingTop) || 0;
  const padBottom = parseFloat(cs.paddingBottom) || 0;
  const padLeft = parseFloat(cs.paddingLeft) || 0;
  const padRight = parseFloat(cs.paddingRight) || 0;

  const controls = modal.querySelector('.controls');
  const controlsH = controls ? controls.getBoundingClientRect().height : 0;
  const controlsMT = controls ? (parseFloat(getComputedStyle(controls).marginTop) || 0) : 0;

  const rowCS = getComputedStyle(row);
  const rowMT = parseFloat(rowCS.marginTop) || 0;
  const rowMB = parseFloat(rowCS.marginBottom) || 0;
  const rowGap = parseFloat(rowCS.rowGap || rowCS.gap) || 0;
  const colGap = parseFloat(rowCS.columnGap || rowCS.gap) || 0;

  // Extra breathing room below the controls so they never sit flush against
  // the modal's bottom edge, even though the boxes are sized to fit tightly.
  const bottomSafety = 14;

  const availContentH = maxModalH - padTop - padBottom - rowMT - rowMB - controlsH - controlsMT - bottomSafety;
  const availContentW = maxModalW - padLeft - padRight;

  const isRow = rowCS.flexDirection === 'row';
  let size;
  if (isRow) {
    const byWidth = (availContentW - colGap) / 2;
    size = Math.min(byWidth, availContentH, 380);
  } else {
    const byHeight = (availContentH - rowGap) / 2;
    size = Math.min(byHeight, availContentW, 340);
  }
  size = Math.max(80, Math.floor(size));

  boxes.forEach(b => { b.style.width = size + 'px'; b.style.height = size + 'px'; });
}

function buildStrokeGroup(groupEl, d) {
  groupEl.innerHTML = '';
  const strokes = splitStrokes(d);
  return strokes.map(strokeD => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'draw');
    path.setAttribute('d', strokeD);
    groupEl.appendChild(path);
    return path;
  });
}

function primePath(path) {
  const length = path.getTotalLength();
  path.style.transition = 'none';
  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;
  path.getBoundingClientRect(); // force reflow
  return length;
}

function drawPath(path, myGen) {
  const length = primePath(path);
  return new Promise(resolve => {
    const duration = Math.min(1.1, Math.max(0.45, length / 200));
    requestAnimationFrame(() => {
      if (myGen !== animGen) return resolve();
      path.style.transition = `stroke-dashoffset ${duration}s ease-in-out`;
      path.style.strokeDashoffset = '0';
    });
    setTimeout(() => resolve(), duration * 1000 + 90);
  });
}

async function drawStrokesInOrder(paths, myGen) {
  for (const path of paths) {
    if (myGen !== animGen) return;
    await drawPath(path, myGen);
  }
}

async function animateLetter() {
  const myGen = ++animGen;
  const upperGroup = document.getElementById('strokesUpper');
  const lowerGroup = document.getElementById('strokesLower');
  if (!upperGroup || !lowerGroup) return;

  const dU = LETTER_PATHS[currentItem.L] || '';
  const dL = LETTER_PATHS_LOWER[currentItem.s] || '';

  const upperPaths = buildStrokeGroup(upperGroup, dU);
  const lowerPaths = buildStrokeGroup(lowerGroup, dL);
  upperPaths.forEach(p => primePath(p));
  lowerPaths.forEach(p => primePath(p));

  await drawStrokesInOrder(upperPaths, myGen);
  if (myGen !== animGen) return;
  await drawStrokesInOrder(lowerPaths, myGen);
}

if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined)
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
</body>
</html>
