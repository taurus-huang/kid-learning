<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學習樂園</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --sky:   #BEE3FF; 
    --cream: #FFF9F0; 
    --sun:   #FFD93D; 
    --coral: #E84040; 
    --grape: #7048D4; 
    --blue:  #4D96FF; 
    --grass: #22C55E; 
    --ink:   #2D2D2D; 
    --white: #FFFFFF;
    --sky-top:   #4AAEFF; 
    --grass-dark:#178A45; 
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* 文件本身不捲動，避免 Android Chrome 網址列收合動畫造成 fixed 背景跟著移動 */
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky) 55%, var(--sky) 100%);
    background-attachment: fixed; /* 天空固定貼齊視窗，捲動時不隨內容移動 */
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  body{
    position: relative;
  }

  /* 真正負責捲動的內層容器：只有標題和卡片在這裡面，
     天空、彩虹、草地、蟲蟲都在這層之外，維持固定不動 */
  .scroll-container{
    position: relative;
    z-index: 20;
    height: 100dvh;
    width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(1.2rem, 4vw, 3rem) clamp(1.5rem, 5vw, 4rem);
  }

  /* 底部草地層：固定貼齊下邊緣 */
  .ground-layer{
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: clamp(150px, 24vh, 260px);
    z-index: 8;
    pointer-events: none;
    overflow: hidden;
    background: transparent;
  }

  .grass-fill{
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 62%;
    background: var(--grass);
  }
  .ground-layer svg{
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* --- 🍃 隨風擺動的 Emoji 花朵植物層 --- */
  .emoji-plants-layer {
    position: absolute;
    bottom: clamp(45px, 9vh, 90px);
    width: 100%;
    height: 50px;
    z-index: 1;
    pointer-events: none;
  }

  .emoji-plant {
    position: absolute;
    font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    transform-origin: bottom center;
    animation: plantSway 4s ease-in-out infinite alternate;
  }

  /* 5 種植物的搖擺動畫時長／延遲各自不同；實際水平位置改由 JS 隨機分佈 */
  .p1 { left: 6%;  animation-duration: 3.5s; }
  .p2 { left: 28%; animation-duration: 4.2s; animation-delay: -0.8s; }
  .p3 { left: 50%; animation-duration: 3.8s; animation-delay: -1.5s; }
  .p4 { left: 72%; animation-duration: 4.5s; animation-delay: -0.3s; }
  .p5 { left: 92%; animation-duration: 3.2s; animation-delay: -2.1s; }

  @keyframes plantSway {
    0% { transform: rotate(-5deg) scale(1); }
    100% { transform: rotate(6deg) scale(1.05); }
  }

  /* --- 🪲 Emoji 昆蟲小動物自由動態層 ---
     改用 fixed 定位並移到 .ground-layer 外面（見 body 內結構），
     因為草地層本身有 overflow:hidden + 有限高度，
     不管 z-index 設多高，巢狀在裡面的元素只要跳得比草地層還高，
     一樣會被草地層的邊界裁掉，跟 z-index 無關 */
  .emoji-bugs-layer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  .emoji-bug {
    position: absolute;
    display: inline-block;
  }

  /* 🦋 蝴蝶：外層負責路徑＋旋轉頭部朝向飛行方向，內層持續 mirror 翻轉模擬振翅 */
  .bug-butterfly {
    font-size: clamp(1.4rem, 2.5vw, 2rem);
    bottom: clamp(65px, 11vh, 110px);
    left: 0;
    animation: flyPathButterfly 60s linear infinite;
  }
  .butterfly-flutter {
    display: inline-block;
    animation: flutterWings 0.3s ease-in-out infinite;
  }
  @keyframes flutterWings {
    0%, 100% { transform: scaleX(1); }
    50%      { transform: scaleX(-1); }
  }
  @keyframes flyPathButterfly {
    0%   { transform: translate(5vw, 0) rotate(90deg); }
    12%  { transform: translate(20vw, -60px) rotate(90deg); }
    24%  { transform: translate(35vw, 15px) rotate(90deg); }
    36%  { transform: translate(50vw, -65px) rotate(90deg); }
    48%  { transform: translate(85vw, 20px) rotate(90deg); }
    50%  { transform: translate(85vw, 20px) rotate(270deg); }
    62%  { transform: translate(65vw, -60px) rotate(270deg); }
    74%  { transform: translate(45vw, 15px) rotate(270deg); }
    86%  { transform: translate(25vw, -65px) rotate(270deg); }
    98%  { transform: translate(5vw, 20px) rotate(270deg); }
    100% { transform: translate(5vw, 0) rotate(90deg); }
  }

  /* 🐝 蜜蜂：左右「8字型」軌跡移動，加大上下擺動幅度，且頭部朝向移動方向 */
  .bug-bee {
    font-size: clamp(1.2rem, 2.2vw, 1.8rem);
    bottom: clamp(60px, 12vh, 100px);
    left: 0;
    animation: flyPathBee 16s linear infinite;

  /* 🐞 瓢蟲：旋轉90度使頭部朝向爬行方向，加入輕微上下偏移不再死板，速度維持88秒一循環 */
  .bug-ladybug {
    font-size: clamp(1.1rem, 2vw, 1.5rem);
    bottom: clamp(25px, 5vh, 45px);
    left: 0;
    animation: crawlLadybug 88s linear infinite;
  }
  /* 瓢蟲內層：獨立負責爬行時的微幅左右搖擺，與外層的前進路徑／朝向旋轉互不干擾 */
  .ladybug-wobble {
    display: inline-block;
    animation: ladybugWobble 0.1s ease-in-out infinite alternate;
  }
  @keyframes ladybugWobble {
    0%   { transform: rotate(-2deg); }
    100% { transform: rotate(2deg); }
  }
  /* 路徑加入不規則的斜上／斜下起伏，頭部朝向（rotate）隨當下爬行的上坡／下坡略微傾斜 */

    0%    { transform: translate(10vw, 0vw)  rotate(90deg); }
    5%    { transform: translate(20vw, 0vw)  rotate(90deg); }
    6%    { transform: translate(21vw, 0vw)  rotate(80deg); }
    12%   { transform: translate(30vw, -2.5vw) rotate(80deg); }
    13%   { transform: translate(31vw, -2.5vw) rotate(100deg); }
    24%   { transform: translate(50vw, 2.5vw)  rotate(100deg); }
    25%   { transform: translate(51vw, 2.5vw)  rotate(80deg); }
    37%   { transform: translate(70vw, -2.5vw) rotate(80deg); }
    38%   { transform: translate(71vw, -2.5vw) rotate(100deg); }
    44%   { transform: translate(80vw, 0vw)  rotate(100deg); }

    62%   { transform: translate(71vw, -2.5vw) rotate(280deg); }
    63%   { transform: translate(70vw, -2.5vw) rotate(260deg); }
    74%   { transform: translate(51vw, 2.5vw)  rotate(260deg); }
    75%   { transform: translate(50vw, 2.5vw)  rotate(280deg); }
    87%   { transform: translate(31vw, -2.5vw) rotate(280deg); }
    88%   { transform: translate(30vw, -2.5vw) rotate(260deg); }
    94%   { transform: translate(21vw, 0vw)  rotate(260deg); }
    95%   { transform: translate(20vw, 0vw)  rotate(270deg); }
    99%   { transform: translate(10vw, 0vw)  rotate(270deg); }
    100%  { transform: translate(10vw, 0vw)  rotate(90deg); }
  }

  /* 🦗 蚱蜢：拋物線跳躍，高度達到卡片下緣，且到盡頭時會轉向往回跳 */

    font-size: clamp(1.1rem, 2vw, 1.5rem);

    //   dir        子功能所在目錄名稱（會組成 "dir/index.html"）
    //   title      卡片標題（含注音標示的 HTML，格式同下方範例）
    //   plainTitle 卡片標題的純文字版本，用於 iframe 的 title 屬性（無障礙用途）
    const MODULES = [
      {
        dir: 'number',
        title: '<span class="zw">數<span class="zw-bpmf n2"><span>ㄕ</span><span>ㄨ</span><span class="tone tone-mid2">ˋ</span></span></span><span class="zw">字<span class="zw-bpmf n1"><span>ㄗ</span><span class="tone tone-top">ˋ</span></span></span>',
        plainTitle: '數字'
      },
      {
        dir: 'zhuyin',
        title: '<span class="zw">注<span class="zw-bpmf n2"><span>ㄓ</span><span>ㄨ</span><span class="tone tone-mid2">ˋ</span></span></span><span class="zw">音<span class="zw-bpmf n2"><span>ㄧ</span><span>ㄣ</span></span></span><span class="zw">符<span class="zw-bpmf n2"><span>ㄈ</span><span>ㄨ</span><span class="tone tone-mid2">ˊ</span></span></span><span class="zw">號<span class="zw-bpmf n2"><span>ㄏ</span><span>ㄠ</span><span class="tone tone-mid2">ˋ</span></span></span>',
        plainTitle: '注音符號'
      },
      {
        dir: 'alphabet',
        title: '<span class="zw">英<span class="zw-bpmf n2"><span>ㄧ</span><span>ㄥ</span></span></span><span class="zw">文<span class="zw-bpmf n2"><span>ㄨ</span><span>ㄣ</span><span class="tone tone-mid2">ˊ</span></span></span><span class="zw">字<span class="zw-bpmf n1"><span>ㄗ</span><span class="tone tone-top">ˋ</span></span></span><span class="zw">母<span class="zw-bpmf n2"><span>ㄇ</span><span>ㄨ</span><span class="tone tone-mid2">ˇ</span></span></span>',
        plainTitle: '英文字母'
      },
      {
        dir: 'clock',
        title: '<span class="zw">時<span class="zw-bpmf n1"><span>ㄕ</span><span class="tone tone-top">ˊ</span></span></span><span class="zw">鐘<span class="zw-bpmf n3"><span>ㄓ</span><span>ㄨ</span><span>ㄥ</span></span></span>',
        plainTitle: '時鐘'
      }
    ];

    // 卡片預設輪替色（當 MODULES 內某筆設定沒有指定 color 時使用）
    const CARD_COLORS = ['var(--grass)', 'var(--coral)', 'var(--blue)', 'var(--sun)', 'var(--grape)'];

    // 依 MODULES 陣列動態產生卡片，href／iframe src／data-src 都只由 dir 這單一來源組成，
    // 避免像先前那樣同一個路徑要在好幾個地方重複打字。
    (function renderCards(){
      const grid = document.getElementById('card-grid');
      if(!grid) return;
      MODULES.forEach((mod, i) => {
        const src = mod.dir + '/index.html';
        const color = CARD_COLORS[i % CARD_COLORS.length];

        const card = document.createElement('a');
        card.className = 'card';
        card.style.setProperty('--card-color', color);
        card.href = src;
        card.target = '_blank';
        card.rel = 'noopener';

        const preview = document.createElement('div');
        preview.className = 'preview-container';
        const iframe = document.createElement('iframe');
        iframe.className = 'card__frame';
        iframe.src = src;
        iframe.title = mod.plainTitle;
        preview.appendChild(iframe);

        const titleEl = document.createElement('div');
        titleEl.className = 'card__title';
        titleEl.setAttribute('data-src', src);
        titleEl.innerHTML = mod.title;

        card.appendChild(preview);
        card.appendChild(titleEl);
        grid.appendChild(card);
      });
    })();

    // 🐌 檢測是否為 Windows 10 22H2 系統，若是則加上 win10-22h2 class 以鏡像翻轉蝸牛
    (function(){
      function applyWin10_22H2_Class() {
        document.body.classList.add('win10-22h2');
      }

      const ua = navigator.userAgent;
      const isWin = /Windows NT 10\.0/.test(ua);

      if (isWin) {
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
          navigator.userAgentData.getHighEntropyValues(["platformVersion", "fullVersionList", "uaFullVersion"])
            .then(uaValues => {
              // 在 Client Hints 中，platformVersion < 13.0.0 代表 Windows 10 (Windows 11 為 13.0.0+)
              // 22H2 build 號為 19045
              const pv = parseFloat(uaValues.platformVersion || '0');
              if (pv > 0 && pv < 13) {
                applyWin10_22H2_Class();
              }
            })
            .catch(() => {
              // 若無法取得 High Entropy Values，但 UA 為 Windows NT 10.0，且排除已知 Win11 特徵
              if (!/Windows NT 11\.0/.test(ua)) {
                applyWin10_22H2_Class();
              }
            });
        } else {
          // 不支援 userAgentData 的瀏覽器 (如 Firefox)，Windows NT 10.0 預設判定為 Windows 10
          applyWin10_22H2_Class();
        }
      }
    })();

    // 5 種植物隨機分佈在草地上：把草地寬度切成 5 等份，
    // 每種植物在自己的區段內取隨機位置，避免重疊、但每次載入位置都不同
    (function(){
      const plants = document.querySelectorAll('.emoji-plant');
      const n = plants.length;
      if(!n) return;
      const segment = 100 / n;
      const padding = segment * 0.15;
      plants.forEach((el, i) => {
        const min = i * segment + padding;
        const max = (i + 1) * segment - padding;
        const pos = min + Math.random() * (max - min);
        el.style.left = pos.toFixed(1) + '%';
      });
    })();

    // 🪲 讓每隻昆蟲一開始就隨機落在自己路徑上的不同位置，
    // 而不是全部從動畫 0% 起點（多半是畫面左側）同步開始
    (function(){
      const bugs = document.querySelectorAll('.emoji-bug');
      bugs.forEach(bug => {
        const duration = parseFloat(getComputedStyle(bug).animationDuration) || 0;
        if(duration > 0){
          const randomDelay = -(Math.random() * duration);
          bug.style.animationDelay = randomDelay.toFixed(2) + 's';
        }
      });
    })();

    // 🌈 大彩虹：以「正圓」弧線繪製，viewBox 直接對應像素尺寸，
    // 讓每一段色帶從最高處到兩側地平線的寬度完全一致（不受畫面比例拉伸影響）
    (function(){
      const svg = document.getElementById('rainbow-svg');
      if(!svg) return;
      const bands = svg.querySelectorAll('.rainbow-band');

      let lastWidth  = null; // 上次「真正」排版時的寬度
      let designH    = null; // 用來計算彩虹大小的高度基準，只有寬度改變時才更新

      function layoutRainbow(){
        const w = window.innerWidth;
        const h = window.innerHeight;

        // viewBox 隨時對齊「目前實際」的寬高，避免非等比例縮放造成色帶被拉伸變形
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

        // 手機捲動時網址列顯示/隱藏只會改變高度，不會改變寬度。
        // 這種情況下天空（彩虹）維持原樣不重新計算，多出來的高度留給草地。
        const widthChanged = (lastWidth === null) || Math.abs(w - lastWidth) > 1;
        if(!widthChanged){
          return;
        }
        lastWidth = w;
        designH   = h;

        const centerX   = w / 2;
        const baseline  = designH * 0.90;           // 彩虹兩端落點：深入草地範圍，會被草地蓋住
        const topMargin = Math.max(designH * 0.10, 24); // 頂端保留的空間（含色帶本身粗細），避免橫向螢幕時彩虹頂被切掉
        let outerR      = w * 0.48;           // 最外圈（紅）半徑：兩側落在畫面邊緣附近
        const maxR      = (baseline - topMargin) / 1.045; // 1.045 ≈ 已預留半個色帶粗細的空間
        outerR = Math.min(outerR, maxR);      // 高度不足時（如橫向螢幕）縮小半徑，留出上方空間
        const strokeW   = Math.max(outerR * 0.09, 10); // 色帶粗細，四色一致

        bands.forEach((path, i) => {
          const r = outerR - i * strokeW;
          const x1 = centerX - r;
          const x2 = centerX + r;
          path.setAttribute('d', `M${x1},${baseline} A${r},${r} 0 0 1 ${x2},${baseline}`);
          path.setAttribute('stroke-width', strokeW.toFixed(2));
        });
      }

      layoutRainbow();
      window.addEventListener('resize', layoutRainbow);
    })();

    // 🀄 卡片標題：從各子功能頁面 <head> 內的 <title> 動態讀取文字，
    // 並依字典轉換為直式注音（格式與「學習樂園」主標題一致）。
    // 若因跨來源限制（例如以 file:// 開啟）讀取失敗，則保留卡片內建的預設標題內容。
    (function(){
      const ZHUYIN_DICT = {
        '數': { letters: ['ㄕ','ㄨ'],      tone: 4 },
        '字': { letters: ['ㄗ'],           tone: 4 },
        '注': { letters: ['ㄓ','ㄨ'],      tone: 4 },
        '音': { letters: ['ㄧ','ㄣ'],      tone: 1 },
        '符': { letters: ['ㄈ','ㄨ'],      tone: 2 },
        '號': { letters: ['ㄏ','ㄠ'],      tone: 4 },
        '時': { letters: ['ㄕ'],           tone: 2 },
        '鐘': { letters: ['ㄓ','ㄨ','ㄥ'], tone: 1 },
        '英': { letters: ['ㄧ','ㄥ'],      tone: 1 },
        '文': { letters: ['ㄨ','ㄣ'],      tone: 2 },
        '母': { letters: ['ㄇ','ㄨ'],      tone: 3 },
        '學': { letters: ['ㄒ','ㄩ','ㄝ'], tone: 2 },
        '習': { letters: ['ㄒ','ㄧ'],      tone: 2 },
        '樂': { letters: ['ㄌ','ㄜ'],      tone: 4 },
        '園': { letters: ['ㄩ','ㄢ'],      tone: 2 },
        '加': { letters: ['ㄐ','ㄧ','ㄚ'], tone: 1 },
        '減': { letters: ['ㄐ','ㄧ','ㄢ'], tone: 3 },
        '乘': { letters: ['ㄔ','ㄥ'],      tone: 2 },
        '除': { letters: ['ㄔ','ㄨ'],      tone: 2 },
        '法': { letters: ['ㄈ','ㄚ'],      tone: 3 },
        '拼': { letters: ['ㄆ','ㄧ','ㄣ'], tone: 1 },
        '單': { letters: ['ㄉ','ㄢ'],      tone: 1 },
        '形': { letters: ['ㄒ','ㄧ','ㄥ'], tone: 2 },
        '狀': { letters: ['ㄓ','ㄨ','ㄤ'], tone: 4 },
        '顏': { letters: ['ㄧ','ㄢ'],      tone: 2 },
        '色': { letters: ['ㄙ','ㄜ'],      tone: 4 },
      };
      const TONE_GLYPH = { 2: 'ˊ', 3: 'ˇ', 4: 'ˋ', 5: '˙' };

      function renderChar(ch){
        const entry = ZHUYIN_DICT[ch];
        if(!entry){
          return `<span class="zw">${ch}</span>`;
        }
        const n = Math.min(entry.letters.length, 3);
        const letterSpans = entry.letters.map(l => `<span>${l}</span>`).join('');
        let toneSpan = '';
        if(entry.tone === 5){
          toneSpan = `<span class="tone tone-neutral">˙</span>`;
        } else if(entry.tone && entry.tone !== 1){
          const posClass = n === 1 ? 'tone-top' : (n === 2 ? 'tone-mid2' : 'tone-mid3');
          toneSpan = `<span class="tone ${posClass}">${TONE_GLYPH[entry.tone]}</span>`;
        }
        return `<span class="zw">${ch}<span class="zw-bpmf n${n}">${letterSpans}${toneSpan}</span></span>`;
      }

      function renderTitle(text){
        return Array.from(text).map(renderChar).join('');
      }

      document.querySelectorAll('.card__title[data-src]').forEach(el => {
        const src = el.getAttribute('data-src');
        fetch(src)
          .then(res => res.text())
          .then(html => {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const title = (doc.querySelector('title') && doc.querySelector('title').textContent || '').trim();
            if(title){
              el.innerHTML = renderTitle(title);
            }
          })
          .catch(() => {
            // 讀取失敗時什麼都不做，保留卡片內建的預設標題內容
          });
      });
    })();
  </script>

</body>
</html>
