<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注音符號</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap');
:root{
  --ini:#E84040;--ini-bg:#FFF0F0;--ini-br:#FFBABA;
  --med:#0FA870;--med-bg:#EAFAF4;--med-br:#80DDB8;
  --fin:#2E86DE;--fin-bg:#EAF3FF;--fin-br:#A9D0F5;
  --page:#FFF9F0;--dark:#2D2D2D;--mid:#636E72;
  --fnt:'Nunito','Noto Sans TC',sans-serif;
  --fzh:'Noto Sans TC',sans-serif;
  --fhz:'Huninn',sans-serif;
  --bcw: clamp(52px,9vw,72px);
  --bcgap: 8px;
  --dbox: clamp(140px, min(60vw,34vh), 380px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--fnt);
  background:linear-gradient(160deg,#fff6e5,#e8f7ff 60%,#f0ffe8);
  min-height:100vh;
  padding:20px;
  overflow-x:hidden;
  -webkit-tap-highlight-color: transparent;
}
.chart-wrap{
  width:100%;
}
.chart{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  max-width:960px;
  margin:24px auto;
  padding:0 6px;
}
.group{
  display:flex;
  flex-direction:row;
  flex-wrap:wrap;
  justify-content:flex-start;
  gap:var(--bcgap);
  width:calc(4 * var(--bcw) + 3 * var(--bcgap));
}
.bc{
  width:var(--bcw);
  aspect-ratio:1/1;
  flex:0 0 auto;
  border-radius:16px;
  border:2px solid transparent;
  font-family:var(--fzh);
  font-size:clamp(20px,4vw,32px);
  font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,0.12), 0 6px 10px rgba(0,0,0,0.06);
  transition:transform .12s ease, box-shadow .12s ease;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
  position:relative;
  overflow:hidden;
}
.bc-thumb{
  position:absolute;
  right:2px;
  bottom:2px;
  width:42%;
  height:42%;
  object-fit:contain;
  pointer-events:none;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));
}
.bc-thumb-fb{
  position:absolute;
  right:1px;
  bottom:-2px;
  font-size:55%;
  line-height:1;
  pointer-events:none;
}
@media (orientation: landscape){
  .chart-wrap{
    height:calc(100dvh - 40px);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    overflow-y:hidden;
  }
  .chart{
    flex-direction:row-reverse;
    align-items:flex-start;
    justify-content:center;
    flex-wrap:nowrap;
    width:max-content;
    max-width:none;
    margin:0 auto;
    padding:0 6px;
  }
  .group{
    flex-direction:column;
    flex-wrap:nowrap;
    justify-content:flex-start;
    width:auto;
    flex:0 0 auto;
  }
  .bc{
    width:clamp(16px, min(calc((100vw - 152px) / 11), calc((100dvh - 84px) / 4)), 140px);
    height:clamp(16px, min(calc((100vw - 152px) / 11), calc((100dvh - 84px) / 4)), 140px);
    font-size:clamp(9px, min(calc((100vw - 152px) / 11 * 0.42), calc((100dvh - 84px) / 4 * 0.42)), 60px);
  }
}
.bc.i{background:var(--ini-bg);color:var(--ini);border-color:var(--ini-br)}
.bc.m{background:var(--med-bg);color:var(--med);border-color:var(--med-br)}
.bc.f{background:var(--fin-bg);color:var(--fin);border-color:var(--fin-br)}
.bc:hover{
  transform:translateY(-3px) scale(1.08);
  filter:brightness(1.08) saturate(1.3);
  box-shadow:0 6px 0 rgba(0,0,0,0.15), 0 10px 16px rgba(0,0,0,0.15);
}
.bc:active{ transform:translateY(2px) scale(.96); box-shadow:0 1px 0 rgba(0,0,0,0.12); }
@media (orientation: portrait){
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  :root{
    --bcw: clamp(48px, min(calc((100vw - 90px) / 4), calc((100dvh - 210px) / 11)), 130px);
  }
  .bc{
    font-size:clamp(20px, min(calc((100vw - 90px) / 4 * 0.42), calc((100dvh - 210px) / 11 * 0.42)), 56px);
  }
}

/* modal */
.overlay{
  position:fixed; inset:0;
  height:100dvh;
  background:rgba(40,30,20,0.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:clamp(6px,2dvh,16px) 16px;
  overflow-y:auto;
}
.overlay.show{ display:flex; }
.modal{
  background:rgba(255,253,247,0.72);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border-radius:28px;
  padding:clamp(50px,8dvh,76px) clamp(18px,4vmin,48px) clamp(14px,4dvh,48px);
  max-width:min(94vw,1200px);
  max-height:min(96dvh,900px);
  overflow-y:auto;
  scrollbar-width:none;
  -ms-overflow-style:none;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
  position:relative;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  margin:auto;
  animation:pop .25s ease;
}
.modal::-webkit-scrollbar{ display:none; }
@media (orientation: landscape){
  .modal{
    padding:clamp(36px,6dvh,60px) clamp(24px,4vw,56px) clamp(10px,3dvh,26px);
    max-width:min(96vw,1300px);
  }
}
@keyframes pop{ from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
.close-btn{
  position:absolute; top:12px; right:14px;
  background:#ffdede; border:none; color:#a33;
  width:clamp(32px,5vmin,44px); height:clamp(32px,5vmin,44px);
  border-radius:50%; font-size:clamp(16px,2.6vmin,22px); font-weight:800; cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease;
}
.close-btn:hover{
  background:#ffc2c2;
  transform:scale(1.1);
  box-shadow:0 4px 10px rgba(0,0,0,0.18);
}
.close-btn:active{ transform:scale(.95); box-shadow:none; }
.dcard-row{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(16px,3vmin,32px); margin:10px 0 20px;
}
@media (orientation: landscape){
  .dcard-row{ flex-direction:row; align-items:stretch; margin:8px 0 12px; }
  :root{ --dbox: clamp(120px, min(36vw, calc(100dvh - 150px)), 440px); }
}
@media (orientation: portrait){
  :root{ --dbox: clamp(90px, min(60vw, calc((100dvh - 280px) / 2)), 340px); }
}
.sbox{
  width:var(--dbox); height:var(--dbox);
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
#ssvg{ width:100%; height:100%; border:2px solid #EEE; border-radius:14px; background:#F7F8FA; transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
.sbox:hover #ssvg{ border-color:#93C5FD; box-shadow:0 4px 14px rgba(0,0,0,.12); transform:scale(1.03); }
.imgbox{
  width:var(--dbox); height:var(--dbox); flex:0 0 auto; border-radius:14px; overflow:hidden;
  border:2px solid #EEE; background:#F4F6FF; display:flex; flex-direction:column;
  container-type:size; container-name:imgbox; cursor:pointer;
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.imgbox:hover{ border-color:#93C5FD; box-shadow:0 4px 14px rgba(0,0,0,.12); transform:scale(1.03); }
.imgarea{ width:100%; flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; }
.imgarea img{ width:70%; height:70%; object-fit:contain; }
.fb-emoji{ font-size:min(60cqh,60cqw); line-height:1; display:inline-block; }
.wordrow{
  display:flex; align-items:center; gap:6px; padding:10px 10px;
  background:#F7F8FA; border-top:1px solid #EEE; flex-wrap:wrap; justify-content:center;
}
.charblock{ display:flex; flex-direction:row; align-items:center; gap:2px; }
.hz{ font-size:clamp(1.6rem,6.5vmin,3.4rem); font-weight:400; font-family:var(--fhz); line-height:1; }
.bpcol{ display:flex; flex-direction:column; align-items:center; }
.bpchars{ display:flex; flex-direction:column; align-items:center; font-size:clamp(.5rem,2.4vmin,1.1rem); font-family:var(--fzh); color:#333; line-height:1.05; }
.bpchars span{ display:block; text-align:center; }
.tm-side{ display:flex; flex-direction:row; align-items:flex-end; }
.tone-r{ font-size:clamp(.65rem,4vmin,2rem); color:#888; align-self:flex-end; position:relative; top:0.4em; left:-0.1em; }
.tm-top{ display:flex; flex-direction:column; align-items:center; position:relative; top:-0.25em; }
.tone-t{ font-size:clamp(.65rem,4vmin,2rem); color:#888; line-height:1; margin-bottom:-0.2em; }

.controls{
  display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:10px;
}
.ctrl-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px;
  padding:clamp(8px,1.6vmin,14px) clamp(14px,3vmin,26px);
  font-family:var(--fnt); font-size:clamp(14px,2.2vmin,20px); font-weight:700; cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,0.15); transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  white-space:nowrap;
}
.ctrl-btn svg{ width:clamp(20px,4vw,28px); height:clamp(20px,4vw,28px); display:block; }
.ctrl-btn:not(:disabled):hover{
  transform:translateY(-2px);
  filter:brightness(1.06) saturate(1.2);
  box-shadow:0 5px 0 rgba(0,0,0,0.15), 0 8px 12px rgba(0,0,0,0.12);
}
.ctrl-btn:not(:disabled):active{
  transform:translateY(3px) scale(.96);
  box-shadow:none;
  filter:brightness(.92);
  transition:transform .05s ease, box-shadow .05s ease, filter .05s ease;
}
.replay{ background:#ffe08a; color:#7a5200; }
.prev,.next{ background:#c9f2c0; color:#245c1a; }
.prev:disabled,.next:disabled{ opacity:.35; cursor:default; }
@media (orientation: landscape){
  .controls{ margin-top:6px; }
}
@media (orientation: portrait){
  .controls{
    flex-wrap:nowrap;
    width:100%;
    gap:clamp(4px,2vw,12px);
  }
  .ctrl-btn{
    flex:1 1 0;
    min-width:0;
    gap:clamp(2px,1.2vw,8px);
    padding:clamp(6px,1.8vw,14px) clamp(4px,2.4vw,22px);
  }
  .ctrl-btn svg{ width:clamp(18px,5vw,24px); height:clamp(18px,5vw,24px); }
}

@keyframes ds{from{stroke-dashoffset:var(--dl)}to{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="chart-wrap"><div class="chart" id="chart"></div></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="dcard-row" id="dcardRow"></div>
    <div class="controls">
      <button class="ctrl-btn prev" id="prevBtn" aria-label="上一個">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="21" x2="12" y2="6"></line>
          <polyline points="5,13 12,6 19,13"></polyline>
        </svg>
      </button>
      <button class="ctrl-btn replay" id="replayBtn" aria-label="重播">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19.3,10 A8,8 0 1 0 19,17"></path>
          <polyline points="20,4 20,11 13,11"></polyline>
        </svg>
      </button>
      <button class="ctrl-btn next" id="nextBtn" aria-label="下一個">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="3" x2="12" y2="18"></line>
          <polyline points="5,11 12,18 19,11"></polyline>
        </svg>
      </button>
    </div>
  </div>
</div>

let audioCtx = null;
let bopoBuffer = null;
let audioReady = false;
let audioToken = 0;      // 每次觸發發音時遞增，用來讓舊的延遲回呼失效
let currentSource = null; // 目前正在播放的注音片段(Web Audio BufferSource)

function initBopoAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const raw = atob(BOPO_AUDIO_B64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    audioCtx.decodeAudioData(arr.buffer, buf => {
      bopoBuffer = buf;
      audioReady = true;
    }, err => console.warn('注音發音檔解碼失敗', err));
  } catch (e) { console.warn('AudioContext 初始化失敗', e); }
}
initBopoAudio();

// 依 BOPO 陣列順序（21 聲母 + 3 介母 + 13 韻母 = 37）取出對應 1 秒鐘發音片段播放
function playSymAudio(item, onEnded) {
  const idx = BOPO.indexOf(item);
  if (audioReady && bopoBuffer && idx >= 0) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const src = audioCtx.createBufferSource();
    src.buffer = bopoBuffer;
    src.connect(audioCtx.destination);
    currentSource = src;
    src.onended = () => {
      if (currentSource === src) currentSource = null;
      if (onEnded) onEnded();
    };
    src.start(0, idx * 1, 1);
    return true;
  }
  return false;
}

// 中止目前正在播放或即將播放的所有發音(注音片段音檔 + 語音合成)，
// 讓按下新按鈕時能立刻接上新的發音，不會與尚未播完的舊發音重疊。
function stopCurrentAudio() {
  if (currentSource) {
    try { currentSource.onended = null; currentSource.stop(); } catch (e) {}
    currentSource = null;
  }
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

const smap = {};
BOPO.forEach(b => smap[b.sym] = b);
let animGen = 0;
let currentIndex = 0;

// 傳統注音符號表排列方式：聲母/介母/韻母依序分為 11 組，每組人數為 4 4 3 3 4 3 3 4 4 4 1
const GROUP_SIZES = [4, 4, 3, 3, 4, 3, 3, 4, 4, 4, 1];
const chartEl = document.getElementById('chart');
let cursor = 0;
GROUP_SIZES.forEach(size => {
  const groupEl = document.createElement('div');
  groupEl.className = 'group';
  for (let i = 0; i < size; i++) {
    const idx = cursor++;
    const item = BOPO[idx];
    const btn = document.createElement('button');
    btn.className = `bc ${item.type}`;
    btn.type = 'button';
    btn.textContent = item.sym;
    btn.title = item.name;
    btn.addEventListener('click', () => openSym(idx));
    addThumb(btn, item);
    groupEl.appendChild(btn);
  }
  chartEl.appendChild(groupEl);
});

const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');
const replayBtn = document.getElementById('replayBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function openSym(idx) {
  playIndex(idx);
  overlay.classList.add('show');
}
function closeModal() {
  overlay.classList.remove('show');
  animGen++;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}
closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

replayBtn.addEventListener('click', () => playIndex(currentIndex));
prevBtn.addEventListener('click', () => { if (currentIndex > 0) playIndex(currentIndex - 1); });
nextBtn.addEventListener('click', () => { if (currentIndex < BOPO.length - 1) playIndex(currentIndex + 1); });

function playIndex(idx) {
  currentIndex = idx;
  const item = BOPO[idx];
  render(item);
  speak(item);
  prevBtn.disabled = (idx === 0);
  nextBtn.disabled = (idx === BOPO.length - 1);
}

function makeUtter(txt) {
  const voices = window.speechSynthesis.getVoices();
  const zh = voices.find(v => /zh.?TW/i.test(v.lang)) || voices.find(v => /zh/i.test(v.lang));
  const x = new SpeechSynthesisUtterance(txt);
  x.lang = 'zh-TW'; x.rate = 0.82;
  if (zh) x.voice = zh;
  return x;
}
function speak(item) {
  if (!window.speechSynthesis) return;
  const myToken = ++audioToken;
  stopCurrentAudio();
  const played = playSymAudio(item, () => {
    if (myToken !== audioToken) return; // 期間已按了新的按鈕，放棄接下來的發音
    setTimeout(() => {
      if (myToken !== audioToken) return;
      window.speechSynthesis.speak(makeUtter(item.name));
    }, 280);
  });
  if (!played) {
    const u1 = makeUtter(item.sym), u2 = makeUtter(item.name);
    u1.onend = () => {
      if (myToken !== audioToken) return;
      setTimeout(() => {
        if (myToken !== audioToken) return;
        window.speechSynthesis.speak(u2);
      }, 280);
    };
    window.speechSynthesis.speak(u1);
  }
}
function speakSym(item) {
  const myToken = ++audioToken;
  stopCurrentAudio();
  const played = playSymAudio(item);
  if (!played && window.speechSynthesis) {
    window.speechSynthesis.speak(makeUtter(item.sym));
  }
}
function speakWord(item) {
  if (!window.speechSynthesis) return;
  ++audioToken;
  stopCurrentAudio();
  window.speechSynthesis.speak(makeUtter(item.name));
}

function loadEmoji(item, container) {
  container.innerHTML = '';
  if (!item.ec) { showFb(container, item); return; }
  const img = document.createElement('img');
  img.style.cssText = 'object-fit:contain';
  img.src = `https://fonts.gstatic.com/s/e/notoemoji/latest/${item.ec}/512.webp`;
  img.onerror = () => {
    if (img.src.includes('.webp')) {
      img.onerror = () => showFb(container, item);
      img.src = `https://fonts.gstatic.com/s/e/notoemoji/latest/${item.ec}/512.gif`;
    } else { showFb(container, item); }
  };
  container.appendChild(img);
}
function showFb(container, item) {
  container.innerHTML = `<span class="fb-emoji">${getEmoji(item)}</span>`;
}
function addThumb(btn, item) {
  if (!item.ec) {
    const span = document.createElement('span');
    span.className = 'bc-thumb-fb';
    span.textContent = getEmoji(item);
    btn.appendChild(span);
    return;
  }
  const img = document.createElement('img');
  img.className = 'bc-thumb';
  img.alt = '';
  // 主頁按鈕縮圖固定使用 PNG（靜態格式，不會有動畫），詳解卡片內的圖片維持原本 webp/gif 不變
  img.src = `https://fonts.gstatic.com/s/e/notoemoji/latest/${item.ec}/512.png`;
  img.onerror = () => {
    img.remove();
    const span = document.createElement('span');
    span.className = 'bc-thumb-fb';
    span.textContent = getEmoji(item);
    btn.appendChild(span);
  };
  btn.appendChild(img);
}
function getEmoji(item) {
  const map = {
    '冰淇淋':'🍦','蘋果':'🍎','貓咪':'🐱','房子':'🏠','蛋糕':'🍰','兔子':'🐰',
    '牛奶':'🥛','老虎':'🐯','小狗':'🐶','恐龍':'🦕','蝴蝶':'🦋','公雞':'🐓',
    '氣球':'🎈','西瓜':'🍉','蜘蛛':'🕷️','車子':'🚗','獅子':'🦁','熱狗':'🌭',
    '足球':'⚽','草莓':'🍓','松鼠':'🐿️','櫻桃':'🍒','烏龜':'🐢','魚':'🐟',
    '喇叭':'🎺','蘿蔔':'🥕','鱷魚':'🐊','葉子':'🍃','愛心':'❤️','飛機':'✈️',
    '泡泡':'🫧','手':'✋','南瓜':'🎃','海豚':'🐬','螃蟹':'🦀','風箏':'🪁','耳朵':'👂'
  };
  return map[item.name] || '🖼️';
}

function mkCharBlocks(rdArr) {
  return rdArr.map(syl => {
    const tc = TONE[syl.t] || '';
    const pSpans = syl.p.map(ph => `<span>${ph}</span>`).join('');
    let bpHTML;
    if (syl.t === '0') {
      bpHTML = `<div class="bpcol tm-top">
        <span class="tone-t">${tc}</span>
        <div class="bpchars">${pSpans}</div>
      </div>`;
    } else {
      bpHTML = `<div class="bpcol tm-side">
        <div class="bpchars">${pSpans}</div>
        ${tc ? `<span class="tone-r">${tc}</span>` : ''}
      </div>`;
    }
    return `<div class="charblock">
      <span class="hz">${syl.h}</span>
      ${bpHTML}
    </div>`;
  }).join('');
}

function render(item) {
  const row = document.getElementById('dcardRow');
  const ghostPaths = item.sk.map(d =>
    `<path d="${d}" fill="none" stroke="#C8C8C8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`
  ).join('');

  row.innerHTML = `
    <div class="sbox" title="重播筆劃動畫">
      <svg id="ssvg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#F7F8FA" rx="7"/>
        <line x1="50" y1="0" x2="50" y2="100" stroke="#EEEEEE" stroke-width="0.5"/>
        <line x1="0" y1="50" x2="100" y2="50" stroke="#EEEEEE" stroke-width="0.5"/>
        ${ghostPaths}
        <g id="ag"></g>
      </svg>
    </div>
    <div class="imgbox" title="念出這個詞">
      <div class="imgarea" id="ea"><span style="font-size:2rem">⏳</span></div>
      <div class="wordrow">
        ${mkCharBlocks(item.rd)}
      </div>
    </div>`;

  loadEmoji(item, document.getElementById('ea'));
  animStrokes(item);

  const sbox = row.querySelector('.sbox');
  sbox.addEventListener('click', () => { animStrokes(item); speakSym(item); });

  const imgbox = row.querySelector('.imgbox');
  imgbox.addEventListener('click', () => speakWord(item));
}

function animStrokes(item) {
  const g = document.getElementById('ag'); if (!g) return;
  g.innerHTML = '';
  const myGen = ++animGen;
  const strokeColor = item.type === 'i' ? '#E84040' : item.type === 'm' ? '#0FA870' : '#2E86DE';

  // 讓每一筆的「畫筆速度」固定，筆劃長度較長者花較多時間、較短者花較少時間
  const SPEED = 0.08;    // px / ms（畫筆移動速度）
  const MIN_DUR = 300;   // 單筆最短動畫時間 (ms)
  const MAX_DUR = 1400;  // 單筆最長動畫時間 (ms)
  const GAP = 200;       // 每筆畫完到下一筆開始的間隔 (ms)
  const START_DELAY = 800; // 第一筆開始前的延遲

  // 先算出每一筆的長度與所需時間，才能依序安排開始時間
  const plans = item.sk.map(d => {
    let len = 80;
    try {
      const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      tmp.setAttribute('d', d);
      len = tmp.getTotalLength() || 80;
    } catch (e) {}
    //const dur = Math.min(MAX_DUR, Math.max(MIN_DUR, len / SPEED));
	const dur = (len / SPEED);
    return { d, dur };
  });

  let delay = START_DELAY;
  plans.forEach(plan => {
    setTimeout(() => {
      if (myGen !== animGen) return;
      const g2 = document.getElementById('ag'); if (!g2) return;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', plan.d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', strokeColor);
      path.setAttribute('stroke-width', '5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      g2.appendChild(path);
      try {
        const len = path.getTotalLength() || 80;
        path.style.setProperty('--dl', len);
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        // path.style.animation = `ds ${plan.dur}ms ease forwards`;
		path.style.animation = `ds ${plan.dur}ms linear forwards`;
      } catch(e) {
        path.style.opacity = '0';
        setTimeout(() => { path.style.transition = 'opacity .3s'; path.style.opacity = '1'; }, 20);
      }
    }, delay);
    delay += plan.dur + GAP;
  });
}

if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined)
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
